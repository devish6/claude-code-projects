<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>V71 — Candles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Real faces only — never a generic keyword (V68: ui-monospace became a sans). -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ─────────────────────────────────────────────────────────────
         V71 — the CANDLES format. An EIGHTH format.

         A birthday cake in a dark room, three candles lit, seen low and
         close. The only light in the frame is the flames: the copy is lit
         BY them, so every word flickers with the candles. At the end the
         candles are blown out and the smoke carries the send line.

         Why, off 2026-09-28 data:
           TikTok — V70 steam 991 / 20 likes, best recent post: a private
                    moment nobody says out loud, shown moving. Keep that.
           IG     — V70 reach 171, but reach went to the posts that put the
                    viewer's OWN date or name on screen: product 287, name
                    spelling 280, typefield 238. The prose cuts took 31-77.
         So: the private moment is the birthday wish (everyone has one,
         nobody has said it), and the birthday itself IS the viewer's
         birth date, so the Moolank turn is not a lookup bolted on — it is
         the day the candles are for.

         Moolank 3 = born on the 3rd, 12th, 21st or 30th (3, 1+2, 2+1,
         3+0). Ruled by Jupiter (Guru). Three candles on the cake.
         Framed as a wound, not a verdict — no promise the wish comes true.
         ───────────────────────────────────────────────────────────── */
      :root {
        --wall:  #120c09;
        --cream: #fff1dc;
        --flame: #ffb347;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--wall); font-family: "Instrument Serif", serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--wall); }

      /* Candlelight on the room: one warm pool that breathes with the flames. */
      #glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(760px 620px at 50% 1180px, rgba(255,160,70,.55), rgba(255,120,40,.12) 55%, rgba(0,0,0,0) 78%),
          radial-gradient(1200px 900px at 50% 1500px, rgba(120,50,20,.45), rgba(0,0,0,0) 70%);
      }
      /* Out-of-focus fairy lights far behind — fills the dead black at the edges. */
      .bokeh { position: absolute; border-radius: 50%; filter: blur(18px); }

      /* The cake: a lit top edge, dark sides, a plate. */
      #cake { position: absolute; left: 150px; top: 1330px; width: 780px; height: 520px; }
      .plate { position: absolute; left: -90px; right: -90px; bottom: -30px; height: 90px; border-radius: 50%;
               background: radial-gradient(ellipse at 50% 30%, #5a4638, #1b1310 70%); }
      .body  { position: absolute; left: 0; right: 0; top: 70px; bottom: 20px; border-radius: 0 0 40px 40px;
               background: linear-gradient(180deg, #e9c9a8 0%, #a8795a 30%, #4a2f22 100%); }
      .icing { position: absolute; left: 0; right: 0; top: 0; height: 150px; border-radius: 50%;
               background: radial-gradient(ellipse at 50% 40%, #fff6ea, #f0d6bb 60%, #c69c7a 100%); }
      .drip  { position: absolute; top: 90px; width: 44px; border-radius: 0 0 22px 22px; background: #f3dcc3; }

      .candle { position: absolute; width: 34px; height: 250px; border-radius: 6px 6px 3px 3px;
                background: repeating-linear-gradient(135deg, #fdf3e6 0 22px, #e8594f 22px 34px); }
      .candle::before { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit;
                        background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.15) 40%, rgba(0,0,0,.45)); }
      .wick { position: absolute; left: 15px; top: -26px; width: 4px; height: 28px; background: #2a1d16; border-radius: 2px; }
      .flame { position: absolute; left: -23px; top: -140px; width: 80px; height: 130px; transform-origin: 50% 100%;
               border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
               background: radial-gradient(ellipse at 50% 72%, #fffbe8 0 18%, #ffd27a 34%, #ff9a2e 58%, rgba(255,90,20,0) 76%);
               filter: blur(1.5px); mix-blend-mode: screen; }
      .halo { position: absolute; left: -150px; top: -260px; width: 334px; height: 334px; border-radius: 50%;
              background: radial-gradient(circle, rgba(255,190,90,.45), rgba(255,140,40,0) 70%); }
      .smoke { position: absolute; left: -30px; top: -80px; width: 90px; height: 90px; border-radius: 50%;
               background: radial-gradient(circle, rgba(235,225,215,.85), rgba(235,225,215,0) 70%); filter: blur(8px); opacity: 0; }

      .line { position: absolute; left: 70px; right: 70px; text-align: center; color: var(--cream);
              line-height: 1.02; letter-spacing: -0.01em;
              text-shadow: 0 0 34px rgba(255,170,80,.45), 0 2px 0 rgba(0,0,0,.4); }
      .line .w { display: inline-block; white-space: pre; }
      .line.i { font-style: italic; color: #ffd9a0; }
      .line.small { font-size: 58px; color: rgba(255,241,220,.62); letter-spacing: .04em; text-shadow: none; }

      .grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="candles"
         data-start="0" data-width="1080" data-height="1920"
         data-duration="24.0">

      <audio id="bed" src="assets/bed.mp3"
             data-start="0" data-duration="24.0" data-volume="0.4"></audio>

      <div id="bokeh"></div>
      <div id="glow"></div>

      <div id="cake">
        <div class="plate"></div>
        <div class="body"></div>
        <div class="icing"></div>
      </div>

      <div id="stage"></div>
      <svg class="grain" width="1080" height="1920">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/></filter>
        <rect width="1080" height="1920" filter="url(#n)"/>
      </svg>
    </div>

    <script>
      /* Scenes: [start, end, lines]. A line is [text, y, size, class].
         Words land one at a time across the scene's first ~55%; the FIRST word
         of every scene is lit on the scene's first frame (cut rule: nothing
         empty at a boundary, nothing fades out at a boundary — the previous
         scene is replaced, not dissolved). */
      const SCENES = [
        [0.0, 3.4, [
          ["You make",           420, 150, ""],
          ["the same wish",      580, 150, ""],
          ["every year.",        740, 150, "i"],
        ]],
        [3.4, 6.6, [
          ["Same one.",          470, 150, ""],
          ["Word for word.",     650, 150, "i"],
        ]],
        [6.6, 10.0, [
          ["You’ve never said it", 440, 124, ""],
          ["out loud.",          590, 150, ""],
          ["Not once.",          770, 150, "i"],
        ]],
        [10.0, 13.6, [
          ["In case",            430, 150, ""],
          ["saying it",          590, 150, ""],
          ["is what stops it.",  750, 140, "i"],
        ]],
        [13.6, 17.6, [
          ["Born on the 3rd, 12th,", 400, 104, ""],
          ["21st or 30th?",      520, 104, ""],
          ["Jupiter.",           690, 190, "i"],
          ["The planet of the wish itself.", 900, 72, ""],
        ]],
        [17.6, 20.6, [
          ["You still",          470, 150, ""],
          ["close your eyes",    630, 150, ""],
          ["for it.",            790, 150, "i"],
        ]],
        [20.6, 24.0, [
          ["Send this to",       420, 140, ""],
          ["the one person",     570, 140, ""],
          ["you’d tell.",        740, 170, "i"],
          ["your numbers · numevix.com", 1000, 58, "small"],
        ]],
      ];
      const BLOW = 20.4;          // candles blown out just before the send line
      const DUR = 24.0;

      const stage = document.getElementById("stage");
      const words = [];           // {el, scene, at}
      SCENES.forEach(([s, e, lines], si) => {
        const all = lines.flatMap(([text], li) => text.split(" ").map((w, wi) => ({ li, wi, w })));
        const span = (e - s) * 0.55;
        let k = 0;
        lines.forEach(([text, y, size, cls], li) => {
          const d = document.createElement("div");
          d.className = "line " + cls;
          d.style.top = y + "px";
          if (!cls.includes("small")) d.style.fontSize = size + "px";
          text.split(" ").forEach((w, wi, arr) => {
            const sp = document.createElement("span");
            sp.className = "w";
            sp.textContent = w + (wi < arr.length - 1 ? " " : "");
            d.appendChild(sp);
            // small footer line lands late and together
            const at = cls.includes("small") ? s + (e - s) * 0.5 : s + (k / Math.max(1, all.length - 1)) * span;
            words.push({ el: sp, si, at: (k === 0 || si === 0) ? s - 0.32 : at, end: e });  // scene 0: the whole hook is on frame 0
            k++;
          });
          stage.appendChild(d);
        });
      });

      /* Deterministic RNG. */
      let seed = 71;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

      /* Background bokeh. */
      const bokeh = document.getElementById("bokeh");
      for (let i = 0; i < 16; i++) {
        const b = document.createElement("div"), s = 40 + rnd() * 90;
        b.className = "bokeh";
        const warm = rnd() > .3;
        Object.assign(b.style, {
          left: rnd() * 1080 - s / 2 + "px", top: 80 + rnd() * 1150 + "px", width: s + "px", height: s + "px",
          background: warm ? "rgba(255,180,100,.22)" : "rgba(160,190,255,.12)",
        });
        bokeh.appendChild(b);
      }

      /* Cake: drips + three candles. */
      const cake = document.getElementById("cake");
      [60, 170, 300, 440, 560, 690].forEach((x) => {
        const d = document.createElement("div"); d.className = "drip";
        d.style.left = x + "px"; d.style.height = 50 + rnd() * 70 + "px"; cake.appendChild(d);
      });
      const CANDLES = [[240, -160], [373, -200], [506, -160]].map(([x, y], i) => {
        const c = document.createElement("div"); c.className = "candle";
        c.style.left = x + "px"; c.style.top = y + "px";
        c.innerHTML = '<div class="halo"></div><div class="wick"></div><div class="flame"></div>' +
                      '<div class="smoke"></div><div class="smoke"></div><div class="smoke"></div>';
        cake.appendChild(c);
        return { flame: c.querySelector(".flame"), halo: c.querySelector(".halo"),
                 smoke: [...c.querySelectorAll(".smoke")], ph: i * 2.1, delay: i * 0.12 };
      });

      const glow = document.getElementById("glow");
      const lines = [...stage.children];
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const flick = (t, ph) => 0.5 * Math.sin(t * 13.1 + ph) + 0.3 * Math.sin(t * 7.3 + ph * 1.7) + 0.2 * Math.sin(t * 23.7 + ph * 0.4);

      function render(t) {
        // Candles: flicker, then blown out with a lean, then smoke rises.
        let lit = 0;
        CANDLES.forEach(({ flame, halo, smoke, ph, delay }) => {
          const out = clamp((t - BLOW - delay) / 0.35, 0, 1);       // 0 lit → 1 out
          const f = flick(t, ph);
          const lean = out > 0 ? -28 * Math.sin(out * Math.PI) : f * 3;
          const sy = (1 + f * 0.07) * (1 - out);
          flame.style.transform = `rotate(${lean}deg) scale(${1 - out * .6}, ${sy})`;
          flame.style.opacity = 1 - out;
          halo.style.opacity = (0.85 + f * 0.15) * (1 - out);
          lit += (1 - out) / 3;
          smoke.forEach((s, k) => {
            const p = clamp((t - BLOW - delay - k * 0.25) / 3.2, 0, 1);
            s.style.opacity = p > 0 ? 0.75 * Math.sin(p * Math.PI) : 0;
            s.style.transform = `translate(${Math.sin(p * 6 + k) * 30 * p}px, ${-p * 520}px) scale(${1 + p * 3})`;
          });
        });
        const f0 = flick(t, 0.9);
        glow.style.opacity = 0.22 + 0.78 * lit * (0.92 + f0 * 0.08);

        // Copy: only the current scene is on screen; words land and settle.
        const cur = SCENES.findIndex(([s, e]) => t >= s && t < e);
        const si = cur < 0 ? SCENES.length - 1 : cur;
        words.forEach(({ el, si: ws, at }) => {
          if (ws !== si) { el.style.opacity = 0; return; }
          const p = clamp((t - at) / 0.32, 0, 1);
          const e = 1 - Math.pow(1 - p, 3);
          el.style.opacity = t >= at ? 0.15 + 0.85 * e : 0;
          el.style.transform = `translateY(${(1 - e) * 26}px)`;
          el.style.filter = `blur(${(1 - e) * 6}px)`;
        });
        // Copy is lit by the candles: brightness follows the flames; after the
        // blow it stays readable, cooler, in the smoke.
        const b = t < BLOW ? 0.9 + f0 * 0.08 : 0.95;
        lines.forEach((l) => { l.style.opacity = b; });
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines["candles"] = tl;
    </script>
  </body>
</html>
