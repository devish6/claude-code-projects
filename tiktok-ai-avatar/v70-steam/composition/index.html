<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>V70 — Steam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Real faces only — never a generic keyword (V68: ui-monospace became a sans). -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ─────────────────────────────────────────────────────────────
         V70 — the STEAM format. A SEVENTH format.

         A bathroom mirror fogged after a shower. Words are written into
         the condensation with a finger; the clear glass shows the dark
         room behind, so ink = where the fog was wiped. Old lines do not
         vanish — the fog creeps back over them and they stay as ghosts,
         so every frame is lit and the rehearsals pile up.

         Why, off 2026-09-25 data:
           TikTok — typefield (a private moment you cannot say out loud,
                    shown moving) grew to 861 / 28 likes, the best recent
                    post. The arithmetic cuts took 1 like (V68 201, product
                    demo 409) and V69's board 6 on 224.
           IG     — typefield 233 reach vs 31-77 for the static prose cuts:
                    reach follows MOTION.
         So: no arithmetic, no chart. One private scene everybody has had
         (winning the argument in the shower), handwriting that MOVES
         every second, the number only at the turn.

         Moolank 2 = born on the 2nd, 11th, 20th or 29th (2, 1+1, 2+0,
         2+9=11→2). Ruled by the Moon. Framed as a wound, not a verdict.
         ───────────────────────────────────────────────────────────── */
      :root {
        --room-a: #3b3530;
        --room-b: #1f2326;
        --fog:    #d9dddc;
        --ink:    #26221f;   /* clear glass showing the dark room */
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--room-b); font-family: "Caveat", cursive; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--room-b); }

      /* The room behind the glass: a warm vanity light top-left, cool tile. */
      .room {
        position: absolute; inset: 0;
        background:
          radial-gradient(520px 420px at 22% 9%, rgba(255,196,120,1), rgba(255,170,90,0) 72%),
          radial-gradient(900px 700px at 80% 85%, rgba(70,110,120,.55), rgba(0,0,0,0) 70%),
          repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 180px),
          repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 180px),
          linear-gradient(170deg, var(--room-a), var(--room-b));
        filter: blur(14px);
        transform: scale(1.06);
      }

      /* Condensation: milky, uneven, heavier at the bottom. */
      .fog {
        position: absolute; inset: 0;
        background:
          radial-gradient(520px 420px at 22% 9%, rgba(255,240,222,.30), rgba(255,240,222,0) 70%),
          radial-gradient(900px 620px at 55% 55%, rgba(226,230,229,.80), rgba(214,219,218,.66) 75%),
          linear-gradient(180deg, rgba(222,226,225,.62), rgba(210,216,215,.80));
      }
      .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: multiply; }

      .drop {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(90,90,90,.35) 60%, rgba(60,60,60,.15));
      }

      .line {
        position: absolute; left: 90px; width: max-content; padding: 0 60px 0 10px;
        color: var(--ink);
        font-weight: 700;
        line-height: .98;
        white-space: nowrap;
        /* soft wet edge where the finger pushed the fog aside */
        text-shadow: 0 0 3px rgba(40,34,30,.55), 0 0 14px rgba(255,255,255,.55);
        filter: blur(.6px);
      }
      .line.small { font-size: 78px; font-weight: 600; }
      .streak {
        position: absolute; width: 11px; border-radius: 6px;
        background: linear-gradient(0deg, rgba(38,34,31,.55), rgba(60,58,56,.18) 40%, rgba(60,58,56,.05));
        filter: blur(.8px);
      }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="steam"
         data-start="0" data-width="1080" data-height="1920"
         data-duration="24.0">

      <audio id="bed" src="assets/bed.mp3"
             data-start="0" data-duration="24.0" data-volume="0.4"></audio>

      <div class="room"></div>
      <div class="fog"></div>
      <svg class="grain" width="1080" height="1920">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/></filter>
        <rect width="1080" height="1920" filter="url(#n)"/>
      </svg>
      <div id="drops"></div>
      <div style="position:absolute;inset:26px;border-radius:18px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 60px rgba(0,0,0,.25);pointer-events:none"></div>
      <div id="stage"></div>
    </div>

    <script>
      /* Each scene: [start, end, lines]. A line is [text, y, size, writeAt, writeDur].
         writeAt is relative to scene start; a NEGATIVE writeAt means the line
         is already part-written on the scene's first frame (cut rule: every
         scene lit on frame 0 of the scene, nothing fades out at a boundary). */
      const SCENES = [
        [0.0, 3.6, [
          ["You won the",        650, 150, -1.0, 1.0],
          ["argument",           810, 150, -0.7, 0.7],
          ["in the shower.",     970, 150, -0.2, 0.8],
          ["Again.",            1210, 190,  1.9, 0.6],
        ]],
        [3.6, 7.0, [
          ["The perfect line.",  730, 130, -0.3, 1.0],
          ["Three days",         990, 170,  1.2, 0.7],
          ["late.",             1160, 170,  1.8, 0.4],
        ]],
        [7.0, 10.2, [
          ["You said it",        770, 150, -0.3, 0.9],
          ["out loud",           930, 150,  0.7, 0.6],
          ["to the tiles.",      1090, 150,  1.3, 0.8],
        ]],
        [10.2, 13.8, [
          ["Then at dinner",     730, 140, -0.3, 0.9],
          ["you said",           890, 140,  0.8, 0.6],
          ["“it’s fine.”", 1090, 200, 1.5, 0.8],
        ]],
        [13.8, 17.6, [
          ["Born on the 2nd,",   690, 110, -0.3, 0.9],
          ["11th, 20th or 29th?", 820, 110,  0.6, 1.0],
          ["Moon.",              1070, 230,  1.9, 0.6],
        ]],
        [17.6, 21.4, [
          ["The words come",     730, 140, -0.3, 0.9],
          ["after the feeling.", 890, 124,  0.8, 1.0],
          ["Not instead of it.", 1130, 124, 2.0, 1.0],
        ]],
        [21.4, 24.0, [
          ["Send this to",       750, 140, -0.3, 0.7],
          ["whoever else",       910, 140,  0.5, 0.7],
          ["rehearses.",         1070, 170,  1.1, 0.7],
          ["your numbers · numevix.com", 1340, 64, 1.7, 0.6],
        ]],
      ];

      const stage = document.getElementById("stage");
      const els = SCENES.map(([, , lines]) => lines.map(([text, y, size]) => {
        const d = document.createElement("div");
        d.className = "line";
        d.textContent = text;
        d.style.top = y + "px";
        d.style.fontSize = size + "px";
        stage.appendChild(d);
        return d;
      }));

      /* Deterministic droplets + a few running streaks. */
      let seed = 11;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const drops = document.getElementById("drops");
      for (let i = 0; i < 140; i++) {
        const s = 3 + rnd() * 11, d = document.createElement("div");
        d.className = "drop";
        Object.assign(d.style, { left: rnd() * 1080 + "px", top: rnd() * 1920 + "px", width: s + "px", height: s * 1.1 + "px", opacity: .35 + rnd() * .5 });
        drops.appendChild(d);
      }
      const STREAKS = Array.from({ length: 7 }, () => {
        const d = document.createElement("div");
        d.className = "streak";
        const x = 110 + rnd() * 860, y0 = 380 + rnd() * 900, start = rnd() * 14, speed = 30 + rnd() * 40;
        d.style.left = x + "px"; d.style.top = y0 + "px";
        drops.appendChild(d);
        return { d, start, speed };
      });

      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const ease = (p) => 1 - Math.pow(1 - p, 2);

      function render(t) {
        SCENES.forEach(([s, e, lines], si) => {
          const next = SCENES[si + 1];
          lines.forEach(([, , , at, dur], li) => {
            const el = els[si][li];
            const local = t - s - at;
            // write-on: finger left → right
            const p = ease(clamp(local / dur, 0, 1));
            let op, blur = 0.6, dy = 0;
            if (t < s) { op = 0; }
            else if (t < e) { op = 1; }
            else if (next && t < next[1]) {
              // ghost: fog creeping back over the previous scene
              const g = clamp((t - e) / 1.1, 0, 1);
              op = 0.32 * (1 - g); blur = 4 + 6 * g; dy = 22 * g;
            } else { op = 0; }
            el.style.opacity = op;
            el.style.clipPath = `inset(-40px ${(1 - p) * 100}% -40px -20px)`;
            el.style.filter = `blur(${blur}px)`;
            el.style.transform = `translateY(${dy}px)`;
          });
        });
        STREAKS.forEach(({ d, start, speed }) => {
          const h = clamp((t - start) * speed, 0, 420);
          d.style.height = h + "px";
          d.style.opacity = h > 0 ? .55 : 0;
        });
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 24, duration: 24, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines["steam"] = tl;
    </script>
  </body>
</html>
