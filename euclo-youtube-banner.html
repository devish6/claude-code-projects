<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2560">
<title>EuClo — YouTube Channel Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2560px;
    height: 1440px;
    overflow: hidden;
    background: #F4F1EC;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  .canvas {
    width: 2560px;
    height: 1440px;
    position: relative;
    background: #F4F1EC;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Safe zone guide (invisible in final — just structure) */
  .safe-zone {
    width: 1546px;
    height: 423px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
  }

  /* Geometric mark: square-within-square */
  .mark {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark .outer {
    width: 120px;
    height: 120px;
    border: 2.5px solid #2C2118;
    position: absolute;
  }

  .mark .middle {
    width: 82px;
    height: 82px;
    border: 2px solid #2C2118;
    position: absolute;
  }

  .mark .inner {
    width: 44px;
    height: 44px;
    background: #2C2118;
    position: absolute;
  }

  /* Divider line */
  .divider {
    width: 1px;
    height: 100px;
    background: #2C2118;
    opacity: 0.25;
    flex-shrink: 0;
  }

  /* Text block */
  .text-block {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .wordmark {
    font-size: 72px;
    font-weight: normal;
    letter-spacing: 0.35em;
    color: #2C2118;
    text-transform: uppercase;
    font-family: 'Georgia', serif;
    line-height: 1;
  }

  .tagline {
    font-size: 19px;
    letter-spacing: 0.2em;
    color: #2C2118;
    opacity: 0.55;
    text-transform: uppercase;
    font-family: 'Georgia', serif;
    font-style: italic;
    line-height: 1;
  }

  /* Subtle full-width rule lines — editorial texture */
  .rule-top {
    position: absolute;
    top: 480px;
    left: 200px;
    right: 200px;
    height: 1px;
    background: linear-gradient(to right, transparent, #2C2118 20%, #2C2118 80%, transparent);
    opacity: 0.1;
  }

  .rule-bottom {
    position: absolute;
    bottom: 480px;
    left: 200px;
    right: 200px;
    height: 1px;
    background: linear-gradient(to right, transparent, #2C2118 20%, #2C2118 80%, transparent);
    opacity: 0.1;
  }

  /* Corner marks — editorial detail */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    opacity: 0.15;
  }

  .corner.tl { top: 60px; left: 60px; border-top: 1.5px solid #2C2118; border-left: 1.5px solid #2C2118; }
  .corner.tr { top: 60px; right: 60px; border-top: 1.5px solid #2C2118; border-right: 1.5px solid #2C2118; }
  .corner.bl { bottom: 60px; left: 60px; border-bottom: 1.5px solid #2C2118; border-left: 1.5px solid #2C2118; }
  .corner.br { bottom: 60px; right: 60px; border-bottom: 1.5px solid #2C2118; border-right: 1.5px solid #2C2118; }

  /* Very subtle dot grid texture in outer regions */
  .dot-grid {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(circle, rgba(44,33,24,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <!-- Dot grid texture -->
  <div class="dot-grid"></div>

  <!-- Corner marks -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Rule lines -->
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>

  <!-- Safe zone content -->
  <div class="safe-zone">
    <!-- Geometric mark -->
    <div class="mark">
      <div class="outer"></div>
      <div class="middle"></div>
      <div class="inner"></div>
    </div>

    <!-- Vertical divider -->
    <div class="divider"></div>

    <!-- Wordmark + tagline -->
    <div class="text-block">
      <div class="wordmark">EuClo</div>
      <div class="tagline">Est. Ontario &nbsp;·&nbsp; Sized for South Asia</div>
    </div>
  </div>
</div>
</body>
</html>
